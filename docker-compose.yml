version: "3.9"

services:

  web:
    build: .

    container_name: alert_guard_backend

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app
      - media_data:/app/media

    ports:
      - "8000:8000"

    depends_on:
      - redis

  redis:
    image: redis:7

    container_name: redis_server

    ports:
      - "6379:6379"

volumes:
  media_data: